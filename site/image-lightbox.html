<!-- Image lightbox for course sites. Paste this whole block into _layouts/default.html,
     just before </body>. Click (or Enter on) any screenshot in .main-inner to open it
     in its own window, sized to the image, to put beside the work or on a second
     screen. If the browser blocks pop-ups, the image enlarges in the page instead,
     with its alt text as the caption (click anywhere or press Esc to go back).
     No libraries, works in light and dark mode. -->
<style>
.main-inner img.zoomable{cursor:zoom-in;}
.main-inner img.zoomable:focus-visible{outline:3px solid #0078D4;outline-offset:3px;}
.lightbox{
  position:fixed;inset:0;z-index:1000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 24px 24px;
  background:rgba(0,0,0,.86);
  cursor:zoom-out;
}
.lightbox.open{display:flex;}
.lightbox img{
  max-width:100%;max-height:calc(100vh - 140px);
  border-radius:6px;background:#fff;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.lightbox-caption{
  color:#fff;font-size:14px;line-height:1.5;text-align:center;
  max-width:900px;margin-top:14px;
}
.lightbox-close{
  position:absolute;top:14px;right:18px;
  width:40px;height:40px;border:none;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;
  font-size:26px;line-height:40px;cursor:pointer;
}
.lightbox-close:hover,.lightbox-close:focus-visible{background:rgba(255,255,255,.28);outline:none;}
.lightbox-popout{
  position:absolute;top:14px;right:68px;
  height:40px;padding:0 16px;border:none;border-radius:20px;
  background:rgba(255,255,255,.14);color:#fff;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.lightbox-popout:hover,.lightbox-popout:focus-visible{background:rgba(255,255,255,.28);outline:none;}
body.lightbox-lock{overflow:hidden;}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const box = document.createElement("div");
  box.className = "lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", "Enlarged image");
  box.innerHTML = '<button type="button" class="lightbox-popout" title="Open the image in its own window, to move beside your work or to another screen">Open in new window &#8599;</button>' +
                  '<button type="button" class="lightbox-close" aria-label="Close">&times;</button>' +
                  '<img alt=""><div class="lightbox-caption"></div>';
  document.body.appendChild(box);
  const big = box.querySelector("img");
  const caption = box.querySelector(".lightbox-caption");
  const closeBtn = box.querySelector(".lightbox-close");
  const popBtn = box.querySelector(".lightbox-popout");
  let opener = null;

  function open(img) {
    opener = img;
    big.src = img.currentSrc || img.src;
    big.alt = img.alt;
    caption.textContent = img.alt;
    box.classList.add("open");
    document.body.classList.add("lightbox-lock");
    closeBtn.focus();
  }
  function close() {
    box.classList.remove("open");
    document.body.classList.remove("lightbox-lock");
    big.removeAttribute("src");
    if (opener) opener.focus();
  }

  // Opens an image in its own window, sized to fit the image and the screen.
  // `from` is the window the click happened in (the page, or a side window).
  // Returns false if the browser blocked the pop-up.
  function popOut(src, alt, natW, natH, from) {
    const scr = from.screen;
    const w = Math.min(natW || 1280, scr.availWidth - 40);
    const h = Math.min(natH || 720, scr.availHeight - 80);
    const win = from.open("", "_blank", "popup,width=" + w + ",height=" + h);
    if (!win) return false;
    win.document.title = alt || "Screenshot";
    win.document.body.style.cssText = "margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;";
    const pic = win.document.createElement("img");
    pic.src = src;
    pic.alt = alt;
    pic.style.cssText = "max-width:100%;max-height:100vh;";
    win.document.body.appendChild(pic);
    return true;
  }

  // Screenshots only: images that are links (badges, logos) keep their link.
  // One click opens the image in its own window; if that's blocked, it enlarges in the page.
  document.querySelectorAll(".main-inner img").forEach(function (img) {
    if (img.closest("a")) return;
    img.classList.add("zoomable");
    img.tabIndex = 0;
    img.title = "Click to open in a new window";
    function show() {
      const from = img.ownerDocument.defaultView || window;
      if (!popOut(img.currentSrc || img.src, img.alt, img.naturalWidth, img.naturalHeight, from)) open(img);
    }
    img.addEventListener("click", show);
    img.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(); }
    });
  });

  // In the enlarged view, the button tries the pop-up again (or opens a tab).
  popBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!popOut(big.src, big.alt, big.naturalWidth, big.naturalHeight, window)) window.open(big.src, "_blank");
    close();
  });

  box.addEventListener("click", close);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && box.classList.contains("open")) close();
  });
});
</script>
